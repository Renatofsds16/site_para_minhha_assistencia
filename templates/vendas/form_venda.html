  9* {% extends "base.html" %}
{% block title %}Nova Venda{% endblock %}

{% block content %}
<div class="card shadow">
    <div class="card-header bg-success text-white">
        <h5>Nova Venda</h5>
    </div>

    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <form method="post">
    {% csrf_token %}

    <!-- OUTROS CAMPOS DA VENDA -->
    <div class="mb-3">
        {{ form.cliente.label_tag }}
        {{ form.cliente }}
    </div>

    <div class="mb-3">
        {{ form.forma_pagamento.label_tag }}
        {{ form.forma_pagamento }}
    </div>

    <!-- 🔍 CAMPO DE PESQUISA -->
    <div class="mb-3">
        <label class="form-label">Pesquisar Produto</label>
        <div class="input-group">
            <span class="input-group-text">
                🔍
            </span>
            <input type="text" id="buscarProduto" class="form-control" placeholder="Digite o nome do produto...">
        </div>
    </div>
</form>

            <div class="d-flex justify-content-end gap-2">
                <!-- CANCELAR (NÃO ENVIA FORM) -->
                <a href="{% url 'vendas:lista_vendas' %}" class="btn btn-secondary">
                    Cancelar
                </a>

                <!-- SALVAR (ENVIA FORM) -->
                <button type="submit" class="btn btn-success">
                    Salvar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById("buscarProduto").addEventListener("keyup", function() {
    let filtro = this.value.toLowerCase();
    let opcoes = document.querySelectorAll("#id_produtos option");

    opcoes.forEach(function(opcao) {
        let texto = opcao.textContent.toLowerCase();
        if (texto.includes(filtro)) {
            opcao.style.display = "";
        } else {
            opcao.style.display = "none";
        }
    });
});
</script>
{% endblock %}
