{% extends "base.html" %}

{% block title %}Produto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm">
            <div class="card-body">

                <h5 class="mb-4">Cadastro de Produto</h5>

                <form method="post">
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}

                            {% if field.errors %}
                                <div class="text-danger small">
                                    {{ field.errors|striptags }}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <button class="btn btn-primary w-100">
                        Salvar
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
