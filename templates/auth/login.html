<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height:100vh;">

<div class="card shadow p-4" style="width: 350px;">
    <h4 class="mb-3 text-center">Acesso ao Sistema</h4>

    {% if erro %}
        <div class="alert alert-danger">{{erro}}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input class="form-control mb-2" name="username" placeholder="Usuário">
        <input type="password" class="form-control mb-3" name="password" placeholder="Senha">
        <button class="btn btn-dark w-100 mb-3">Entrar</button>
    </form>

    <div class="text-center">
        <small>Não tem uma conta? <a href="{% url 'accounts:cadastro' %}">Criar conta</a>
</small>
    </div>
</div>

</body>
</html>
